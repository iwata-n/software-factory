<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run カンバン | Software Factory</title>
  <link rel="stylesheet" href="/operations/board.css">
  <script type="module" src="/operations/board.js"></script>
</head>
<body>
  <header class="masthead">
    <span class="brand">
      <svg class="brand-mark" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <rect x="3" y="3" width="22" height="22" rx="3"></rect>
        <path d="M8 9h12M8 14h12M8 19h12"></path>
      </svg>
      <span>Software Factory</span>
    </span>
    <div class="masthead-actions">
      <button id="task-open" class="primary icon-label" type="button" hidden>
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12"></path></svg>
        <span>新規タスク</span>
      </button>
      <details id="toolbar" class="masthead-menu" hidden>
        <summary class="icon-label">
          <span>メニュー</span>
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5 8 5 5 5-5"></path></svg>
        </summary>
        <div class="masthead-menu-panel">
          <p id="account-name" hidden></p>
          <button id="integration-open" type="button" hidden>連携設定</button>
          <button id="accounts-open" type="button" hidden>アカウント管理</button>
          <button id="disconnect" type="button">切断</button>
        </div>
      </details>
    </div>
  </header>
  <main>
    <h1>Run カンバン</h1>
    <form id="login" class="account-form" hidden>
      <label>ユーザー名<input id="login-username" name="username" autocomplete="username"
        autocapitalize="none" spellcheck="false" minlength="3" maxlength="64" required></label>
      <label>パスワード<input id="login-password" name="password" type="password"
        autocomplete="current-password" maxlength="256" required></label>
      <button type="submit">ログイン</button>
    </form>
    <details id="token-login">
      <summary>トークンで接続</summary>
      <form id="connect">
      <label for="token">Workspace の User トークン</label>
      <div class="controls">
        <input type="password" id="token" required autocomplete="off" spellcheck="false">
        <button type="submit">接続</button>
      </div>
      </form>
    </details>
    <section id="execution" class="execution" aria-labelledby="execution-title" hidden>
      <div class="execution-strip">
        <h2 id="execution-title">Workspace の実行状態</h2>
        <p id="execution-state" role="status"></p>
        <details id="worker-panel" class="worker-panel" hidden>
          <summary class="icon-label">
            <span>Worker の状態</span>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5 8 5 5 5-5"></path></svg>
          </summary>
          <div class="worker-popover">
            <p id="worker-status" role="status"></p>
            <div id="worker-list"></div>
          </div>
        </details>
        <button id="execution-action" type="button" hidden></button>
      </div>
      <form id="execution-form" hidden>
        <label for="execution-reason">操作の理由</label>
        <div class="controls">
          <input id="execution-reason" maxlength="2000" required>
          <button id="execution-submit" type="submit"></button>
          <button id="execution-dismiss" type="button">閉じる</button>
        </div>
      </form>
      <p id="execution-message" role="status" hidden></p>
    </section>
    <div class="board-toolbar">
      <p id="status" role="status">ログインすると Run を表示します。</p>
      <div id="board-navigation" class="board-navigation" hidden>
        <button id="board-previous" type="button" aria-label="前のレーン" aria-controls="board">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m12 5-5 5 5 5"></path></svg>
        </button>
        <button id="board-next" type="button" aria-label="次のレーン" aria-controls="board">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m8 5 5 5-5 5"></path></svg>
        </button>
      </div>
    </div>
    <div id="board" class="board" role="region" tabindex="0"
      aria-label="Run の状態別カンバン。横にスクロールしてレーンを表示" hidden></div>
    <button id="older" hidden>過去の Run を追加表示</button>
  </main>
  <dialog id="accounts-dialog" aria-labelledby="accounts-title">
    <header class="detail-header">
      <h2 id="accounts-title">アカウント管理</h2>
      <form method="dialog"><button>閉じる</button></form>
    </header>
    <p id="accounts-status" role="status"></p>
    <div id="accounts-list"></div>
    <form id="account-create" class="account-form" hidden>
      <h3>アカウントを追加</h3>
      <label>ユーザー名<input name="username" autocomplete="off" autocapitalize="none"
        spellcheck="false" pattern="[A-Za-z0-9][A-Za-z0-9_.\-]{2,63}" required></label>
      <label>初期パスワード<input name="password" type="password" autocomplete="new-password"
        minlength="12" maxlength="256" required></label>
      <label>権限<select name="access">
        <option value="VIEWER">閲覧者</option>
        <option value="OPERATOR">操作者</option>
        <option value="ADMIN">管理者</option>
      </select></label>
      <button type="submit">追加</button>
    </form>
  </dialog>
  <dialog id="task-dialog" aria-labelledby="task-heading">
    <header class="detail-header">
      <h2 id="task-heading">新規タスク</h2>
      <form method="dialog"><button>閉じる</button></form>
    </header>
    <p id="task-status" role="status"></p>
    <button id="task-run" type="button" hidden>作成したタスクを実行</button>
    <form id="task-form" hidden>
      <label>プロジェクト<select id="task-project" required></select></label>
      <label>リポジトリ<select id="task-repository" required></select></label>
      <p id="task-write-scope"></p>
      <label>タイトル<input id="task-title" maxlength="200" required></label>
      <label>目的<textarea id="task-objective" rows="3" maxlength="16000" required></textarea></label>
      <label>受け入れ条件<textarea id="task-criteria" rows="4" maxlength="400099" required
        aria-describedby="task-criteria-help"></textarea></label>
      <p id="task-criteria-help">合否を判断できる条件を1行に1件ずつ入力してください。</p>
      <label>制約（任意）<textarea id="task-constraints" rows="2"
        aria-describedby="task-constraints-help"></textarea></label>
      <p id="task-constraints-help">1行に1件ずつ入力してください。</p>
      <button id="task-submit" type="submit">タスクを作成</button>
    </form>
  </dialog>
  <dialog id="integration-settings" aria-labelledby="integration-title">
    <header class="detail-header">
      <h2 id="integration-title">連携設定</h2>
      <form method="dialog"><button>閉じる</button></form>
    </header>
    <p id="integration-status" role="status"></p>
    <div id="integration-providers"></div>
  </dialog>
  <dialog id="detail" aria-labelledby="detail-title">
    <header class="detail-header">
      <h2 id="detail-title">Run 詳細</h2>
      <div class="dialog-actions">
        <form method="dialog"><button>閉じる</button></form>
        <button id="reload-detail" type="button">詳細を更新</button>
      </div>
    </header>
    <p id="detail-status" role="status"></p>
    <div id="detail-content"></div>
  </dialog>
</body>
</html>
