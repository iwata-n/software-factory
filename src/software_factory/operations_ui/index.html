<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run カンバン | Software Factory</title>
  <link rel="stylesheet" href="/operations/board.css">
  <script type="module" src="/operations/board.js"></script>
</head>
<body>
  <header class="masthead"><span>Software Factory</span><span>運用</span></header>
  <main>
    <h1>Run カンバン</h1>
    <form id="connect">
      <label for="token">Workspace の User トークン</label>
      <div class="controls">
        <input type="password" id="token" required autocomplete="off" spellcheck="false">
        <button type="submit">接続</button>
      </div>
    </form>
    <div id="toolbar" class="controls" hidden>
      <button id="refresh">更新</button>
      <button id="disconnect">切断</button>
    </div>
    <section id="execution" class="execution" aria-labelledby="execution-title" hidden>
      <h2 id="execution-title">Workspace の実行状態</h2>
      <p id="execution-state" role="status"></p>
      <button id="execution-action" type="button" hidden></button>
      <form id="execution-form" hidden>
        <label for="execution-reason">操作の理由</label>
        <div class="controls">
          <input id="execution-reason" maxlength="2000" required>
          <button id="execution-submit" type="submit"></button>
          <button id="execution-dismiss" type="button">閉じる</button>
        </div>
      </form>
      <p id="execution-message" role="status" hidden></p>
    </section>
    <details id="worker-panel" class="execution" hidden>
      <summary>Worker の状態</summary>
      <p id="worker-status" role="status"></p>
      <div id="worker-list"></div>
    </details>
    <p id="status" role="status">User トークンで接続すると Run を表示します。</p>
    <div id="board" class="board" aria-label="Run の状態別一覧" hidden></div>
    <button id="older" hidden>過去の Run を追加表示</button>
  </main>
  <dialog id="detail" aria-labelledby="detail-title">
    <header class="detail-header">
      <h2 id="detail-title">Run 詳細</h2>
      <form method="dialog"><button>閉じる</button></form>
    </header>
    <button id="reload-detail">詳細を更新</button>
    <p id="detail-status" role="status"></p>
    <div id="detail-content"></div>
  </dialog>
</body>
</html>
