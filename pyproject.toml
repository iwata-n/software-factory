[project]
name = "software-factory"
version = "0.1.0"
description = "Deterministic control plane for a software factory"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=44,<50",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
factory = "software_factory.cli:main"
factory-worker = "software_factory.worker:main"
factory-source-runner = "software_factory.source_runner:main"
factory-publisher = "software_factory.publisher:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database",
  "ac(*ids): acceptance criteria verified by this test",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
