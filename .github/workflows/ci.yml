name: control-plane
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publication_evidence_blob:
        description: Git blob SHA of the real publication evaluation for this exact implementation
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factory -d factory_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      FACTORY_DATABASE_URL: postgresql+psycopg://factory:factory@127.0.0.1:5432/factory_test
      TEST_DATABASE_URL: postgresql+psycopg://factory:factory@127.0.0.1:5432/factory_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.11
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - name: Install PostgreSQL 17 backup clients
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build managed Linux runner with cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: runner
          load: true
          push: false
          provenance: false
          tags: software-factory-runner:dev
          cache-from: type=gha,scope=managed-runner
          cache-to: type=gha,mode=max,scope=managed-runner,ignore-error=true,timeout=1m
      - name: Pin managed Linux runner image
        run: |
          factory_runner_image=$(docker image inspect software-factory-runner:dev --format '{{.Id}}')
          echo "FACTORY_RUNNER_IMAGE_DIGEST=${factory_runner_image}" >> "$GITHUB_ENV"
          echo "SF21_TEST_IMAGE=${factory_runner_image}" >> "$GITHUB_ENV"
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: mkdir -p .local/acceptance/current
      - name: Run full suite with four workers
        run: uv run --no-sync pytest -q -n 4 --dist worksteal --max-worker-restart=0 --durations=20 --junitxml=.local/acceptance/current/junit.xml
      - name: Verify real publication evidence when supplied
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_PUBLICATION_EVIDENCE_BLOB: ${{ inputs.publication_evidence_blob }}
        run: |
          if [ -n "$FACTORY_PUBLICATION_EVIDENCE_BLOB" ]; then
            uv run python scripts/collect_publication_evidence.py --repository "$GITHUB_REPOSITORY" --evaluation-blob "$FACTORY_PUBLICATION_EVIDENCE_BLOB" --output .local/acceptance/current
          else
            uv run python scripts/collect_publication_evidence.py --repository "$GITHUB_REPOSITORY" --discover --output .local/acceptance/current
          fi
      - run: uv run python scripts/verify_acceptance.py .local/acceptance/current --allow-ci-pending
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-acceptance
          path: .local/acceptance/current/
          include-hidden-files: true
          retention-days: 30
