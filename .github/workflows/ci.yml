name: control-plane
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factory -d factory_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      FACTORY_DATABASE_URL: postgresql+psycopg://factory:factory@127.0.0.1:5432/factory_test
      TEST_DATABASE_URL: postgresql+psycopg://factory:factory@127.0.0.1:5432/factory_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.11
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: mkdir -p .local/acceptance/current
      - run: uv run pytest -q --junitxml=.local/acceptance/current/junit.xml
      - run: uv run python scripts/verify_acceptance.py .local/acceptance/current --allow-ci-pending
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sf01-07-acceptance
          path: .local/acceptance/current/
          include-hidden-files: true
          retention-days: 30
